<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reimagined Journey</title>
<style>
:root{--bg:#09090b;--card:#131318;--card2:#1a1a21;--border:#26262e;--text:#f2f2f5;--muted:#8a8a96;--accent:#7c9cff;--danger:#ff6b6b;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 20% -10%,#1a2040 0%,transparent 60%),var(--bg);color:var(--text);min-height:100dvh}
.hid{display:none!important}

/* ---------- main site ---------- */
#userbar{position:fixed;top:12px;right:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
#userbar img{width:26px;height:26px;border-radius:50%}
#userbar a{color:var(--accent);text-decoration:none}
#stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:70px 20px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;width:100%;max-width:420px}
.card h1{font-size:22px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px;margin-bottom:20px}
.card input{width:100%;height:46px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:0 14px;color:var(--text);font-size:16px;outline:none;margin-bottom:10px}
.card input:focus{border-color:var(--accent)}
.btn{display:block;width:100%;height:46px;line-height:46px;text-align:center;border:0;border-radius:12px;background:var(--accent);color:#000;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;padding:0}
.err{color:var(--danger);font-size:13px;margin-top:10px;text-align:center}
#content{max-width:800px;width:100%}

/* ---------- admin drawer ---------- */
#adm-btn{position:fixed;top:12px;left:12px;z-index:9999;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 13px system-ui,sans-serif;cursor:pointer}
#adm{position:fixed;top:0;left:0;bottom:0;width:min(380px,100vw);z-index:9998;background:#0f0f13;border-right:1px solid var(--border);padding:60px 16px 16px;overflow:auto;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5);font-size:14px}
#adm.open{transform:none}
#adm h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px}
#adm input{width:100%;height:42px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--text);font-size:15px;outline:none;margin-bottom:8px}
#adm input:focus{border-color:var(--accent)}
#adm button{height:40px;border:0;border-radius:10px;background:var(--accent);color:#000;font-weight:600;cursor:pointer;padding:0 14px;width:100%}
#adm button.d{background:transparent;border:1px solid #4a2a2a;color:var(--danger);height:28px;font-size:12px;width:auto;margin-top:8px}
#adm button.g{background:transparent;border:1px solid var(--border);color:var(--text);width:auto;height:30px}
#adm .m{color:var(--muted);font-size:12px}
#adm .it{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
#adm .tp,#adm .row{display:flex;justify-content:space-between;align-items:center}
#adm .row{margin-top:6px}
#adm .k{font-family:ui-monospace,monospace;font-size:13px;cursor:pointer}
#adm .p{font-size:11px;padding:2px 8px;border-radius:99px}
#adm .p.waiting{background:#2b2512;color:var(--warn)}
#adm .p.locked{background:#112a1b;color:var(--ok)}
#adm .big{background:var(--card2);border:1px dashed var(--border);border-radius:12px;padding:14px;text-align:center;margin-top:10px}
#adm .big .k{font-size:19px;letter-spacing:1.5px}
#adm .tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
#adm img{width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:6px}
#adm .err{margin-top:6px;text-align:left}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
</style>
</head>
<body>

<!-- ============ ADMIN (top-left) ============ -->
<button id="adm-btn">☰ Admin</button>
<div id="adm">
  <div id="a-login">
    <h3 style="margin-top:0">Staff login</h3>
    <input id="a-pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="a-go">Unlock</button>
    <div id="a-err" class="err hid"></div>
  </div>

  <div id="a-main" class="hid">
    <div class="row" style="margin-top:0">
      <b id="a-role"></b><button class="g" id="a-out">Log out</button>
    </div>

    <h3>Generate key</h3>
    <input id="a-note" placeholder="Ticket # / note (optional)" maxlength="80" />
    <button id="a-gen">Generate 2-hour key</button>
    <div id="a-big" class="big hid">
      <div class="m">Latest key (click to copy)</div>
      <div class="k" id="a-bk"></div>
      <div class="tm" id="a-bt"></div>
      <div class="m" id="a-bm"></div>
    </div>

    <h3>Active keys <span id="a-cnt" class="m"></span></h3>
    <div id="a-keys"></div>

    <h3>Logged in on site <span id="a-ocnt" class="m"></span></h3>
    <div id="a-online"></div>
  </div>
</div>

<!-- ============ MAIN SITE ============ -->
<div id="userbar" class="hid"></div>
<div id="stage"></div>

<script>
/* =================== MAIN SITE =================== */
const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [s / 3600 | 0, s % 3600 / 60 | 0, s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
const av = u => /^https:\/\/[\w.-]+\.rbxcdn\.com\//.test((u && u.avatar) || '') ? u.avatar : '';

let unlockedShown = false;

function renderBar(user) {
  const b = $('#userbar'); b.replaceChildren();
  if (!user) { b.classList.add('hid'); return; }
  b.classList.remove('hid');
  const s = av(user); if (s) { const i = h('img'); i.src = s; b.append(i); }
  const lo = h('a', null, 'Log out'); lo.href = '/api/auth/logout';
  b.append(h('span', null, user.name), lo);
}

function gate(content) {
  const st = $('#stage'); st.replaceChildren(); unlockedShown = false;
  const c = h('div', 'card'); c.append(...content); st.append(c);
}

async function check() {
  let d;
  try { d = await (await fetch('/api/me')).json(); } catch { return; }
  renderBar(d.user);

  // step 1: Roblox username
  if (!d.user) {
    if ($('#rbIn')) return; // don't wipe what they're typing
    const i = h('input'); i.id = 'rbIn'; i.placeholder = 'Roblox username'; i.autocomplete = 'off';
    const b = h('button', 'btn', 'Continue');
    const msg = h('div', 'err hid');
    const go = async () => {
      b.textContent = 'Checking...';
      const r = await fetch('/api/auth/roblox', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: i.value }) });
      const j = await r.json(); b.textContent = 'Continue';
      if (j.ok) check(); else { msg.textContent = j.error || 'Failed'; msg.classList.remove('hid'); }
    };
    b.onclick = go; i.addEventListener('keydown', e => e.key === 'Enter' && go());
    return gate([h('h1', null, 'Welcome'), h('p', null, 'Enter your Roblox username to continue.'), i, b, msg]);
  }

  // step 2: key
  if (!d.unlocked) {
    if ($('#keyIn') && !d.error) return;
    const i = h('input'); i.id = 'keyIn'; i.placeholder = 'XXXX-XXXX-XXXX-XXXX'; i.autocomplete = 'off';
    const b = h('button', 'btn', 'Redeem key');
    const msg = h('div', 'err', d.error || ''); if (!d.error) msg.classList.add('hid');
    const go = async () => {
      b.textContent = 'Checking...';
      const r = await fetch('/api/redeem', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: i.value }) });
      const j = await r.json(); b.textContent = 'Redeem key';
      if (j.ok) check(); else { msg.textContent = j.error || 'Invalid key'; msg.classList.remove('hid'); }
    };
    b.onclick = go; i.addEventListener('keydown', e => e.key === 'Enter' && go());
    return gate([h('h1', null, 'Enter your key'), h('p', null, 'Open a ticket in the Discord server to get one. Keys last 2 hours and lock to your IP.'), i, b, msg]);
  }

  // step 3: unlocked, load protected content once
  if (!unlockedShown) {
    const r = await fetch('/api/content');
    if (!r.ok) return;
    const j = await r.json();
    const st = $('#stage'); st.replaceChildren();
    const box = h('div'); box.id = 'content'; box.innerHTML = j.html; // html comes from your own api/content.js
    st.append(box); unlockedShown = true;
  }
}
check(); setInterval(check, 30000);

/* =================== ADMIN DRAWER =================== */
(() => {
  let tok = sessionStorage.getItem('atok'), role = sessionStorage.getItem('arole'), st = { keys: [], online: [] }, poll;

  async function api(p, opt = {}) {
    const r = await fetch('/api/' + p, { ...opt, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok } });
    if (r.status === 401) { logout(); throw 0; }
    return r.json();
  }
  const copy = (t, el) => { navigator.clipboard.writeText(t); const o = el.textContent; el.textContent = 'Copied!'; setTimeout(() => el.textContent = o, 900); };

  function logout() {
    sessionStorage.removeItem('atok'); sessionStorage.removeItem('arole'); tok = null; clearInterval(poll);
    $('#a-main').classList.add('hid'); $('#a-login').classList.remove('hid');
  }
  function show() {
    $('#a-login').classList.add('hid'); $('#a-main').classList.remove('hid');
    $('#a-role').textContent = (role || '').toUpperCase();
    refresh(); clearInterval(poll); poll = setInterval(refresh, 5000);
  }

  $('#adm-btn').onclick = () => $('#adm').classList.toggle('open');
  $('#a-out').onclick = logout;
  $('#a-go').onclick = async () => {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#a-pw').value }) });
    const d = await r.json();
    if (!r.ok) { $('#a-err').textContent = d.error || 'Failed'; $('#a-err').classList.remove('hid'); return; }
    tok = d.token; role = d.role; sessionStorage.setItem('atok', tok); sessionStorage.setItem('arole', role);
    $('#a-pw').value = ''; $('#a-err').classList.add('hid'); show();
  };
  $('#a-pw').addEventListener('keydown', e => e.key === 'Enter' && $('#a-go').click());
  $('#a-gen').onclick = async () => {
    await api('panel', { method: 'POST', body: JSON.stringify({ action: 'create', note: $('#a-note').value }) });
    $('#a-note').value = ''; refresh();
  };

  async function refresh() {
    try { st = await api('panel'); } catch { return; }
    const keys = [...st.keys].sort((a, b) => b.createdAt - a.createdAt);
    $('#a-cnt').textContent = `(${keys.length})`; $('#a-ocnt').textContent = `(${st.online.length})`;

    const L = keys[0]; $('#a-big').classList.toggle('hid', !L);
    if (L) {
      $('#a-bk').textContent = L.key; $('#a-bk').onclick = () => copy(L.key, $('#a-bk'));
      $('#a-bt').dataset.exp = L.expires;
      $('#a-bm').textContent = L.status === 'locked' ? 'Locked to ' + (L.user?.name || 'user') : 'Not used yet';
    }

    const kl = $('#a-keys'); kl.replaceChildren();
    if (!keys.length) kl.append(h('div', 'm', 'No active keys'));
    keys.forEach(k => {
      const it = h('div', 'it'), tp = h('div', 'tp');
      const kk = h('span', 'k', k.key); kk.onclick = () => copy(k.key, kk);
      tp.append(kk, h('span', 'p ' + k.status, k.status === 'locked' ? 'In use' : 'Waiting')); it.append(tp);
      if (k.note) it.append(h('div', 'm', k.note));
      if (k.user) { const u = h('div', 'm'); const s = av(k.user); if (s) { const i = h('img'); i.src = s; u.append(i); } u.append(k.user.name || 'unknown'); it.append(u); }
      const r = h('div', 'row m'); const left = h('span'); left.dataset.exp = k.expires; left.dataset.pre = '1';
      r.append(left, h('span', null, k.ip ? 'IP ' + k.ip : 'IP —')); it.append(r);
      const rv = h('button', 'd', 'Revoke');
      rv.onclick = async () => { if (confirm('Revoke ' + k.key + '?')) { await api('panel', { method: 'POST', body: JSON.stringify({ action: 'revoke', key: k.key }) }); refresh(); } };
      it.append(rv); kl.append(it);
    });

    const ol = $('#a-online'); ol.replaceChildren();
    if (!st.online.length) ol.append(h('div', 'm', 'Nobody online'));
    st.online.forEach(u => {
      const r = h('div', 'it'); r.append(h('span', 'dot'));
      const s = av(u); if (s) { const i = h('img'); i.src = s; r.append(i); }
      r.append(u.name || 'unknown'); ol.append(r);
    });
    tick();
  }
  function tick() {
    document.querySelectorAll('#adm [data-exp]').forEach(el => {
      const l = Number(el.dataset.exp) - Date.now();
      el.textContent = l > 0 ? (el.dataset.pre ? 'Expires in ' + fmt(l) : fmt(l)) : 'Expired';
    });
  }
  setInterval(tick, 1000);
  if (tok) show();
})();
</script>
</body>
</html>
