<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Velocity-Net" />
  <meta name="theme-color" content="#000000" />
  <title>Velocity-Net</title>
  <style>
    :root {
      --bg: #000;
      --card: #111;
      --accent: #fff;
      --muted: #888;
      --border: #222;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--accent);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .status-bar { height: env(safe-area-inset-top, 12px); }
    header {
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 11px;
      background: #0a0a0a; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo svg { width: 24px; height: 24px; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .search-bar {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .search-bar input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-bar input::placeholder { color: #555; }
    .search-bar button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .search-bar button:active { opacity: 0.85; }

    .meta {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #grid {
      flex: 1;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .item {
      position: relative;
      aspect-ratio: 1;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    .item img, .item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .item .score {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0,0,0,0.7);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .empty, .error, .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .error { color: var(--danger); }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #lightbox.active { display: flex; }
    #lightbox img, #lightbox video {
      max-width: 100%;
      max-height: 80dvh;
      border-radius: 8px;
      object-fit: contain;
    }
    #lightbox .close {
      position: absolute;
      top: calc(env(safe-area-inset-top, 12px) + 8px);
      right: 16px;
      background: #222;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
    #lightbox .info {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      max-width: 90%;
      word-break: break-all;
    }

    .load-more {
      padding: 16px;
      text-align: center;
    }
    .load-more button {
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="status-bar"></div>
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>
    <div>
      <h1>Velocity-Net</h1>
      <div class="sub">Rule34 API · authenticated</div>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="tags" placeholder="tags (e.g. 1girl rating:safe)" value="" autocomplete="off" />
    <button id="btnSearch">Search</button>
  </div>

  <div class="meta">
    <span id="status">Ready</span>
    <span id="count"></span>
  </div>

  <div id="grid">
    <div class="empty">Enter tags and search</div>
  </div>

  <div class="load-more" id="loadMoreWrap" style="display:none;">
    <button id="btnMore">Load more</button>
  </div>

  <div id="lightbox">
    <button class="close" id="btnClose">×</button>
    <div id="lbContent"></div>
    <div class="info" id="lbInfo"></div>
  </div>

  <script>
    // Your credentials
    const API_KEY = "c077095d207d5f75ff398260363969d57c449972ae08ae0b028f1631a48987ae5d82d02883bb7af31f8ea7c93e09cfd484acf89904ccce1f3541629a0d580c65";
    const USER_ID = "6918190";
    const BASE = "https://api.rule34.xxx/index.php";

    let currentPage = 0;
    let currentTags = "";
    let loading = false;

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const lightbox = document.getElementById("lightbox");
    const lbContent = document.getElementById("lbContent");
    const lbInfo = document.getElementById("lbInfo");

    function buildUrl(tags, pid = 0, limit = 40) {
      const params = new URLSearchParams({
        page: "dapi",
        s: "post",
        q: "index",
        json: "1",
        limit: String(limit),
        pid: String(pid),
        tags: tags || "",
        api_key: API_KEY,
        user_id: USER_ID
      });
      return `${BASE}?${params.toString()}`;
    }

    async function search(tags, reset = true) {
      if (loading) return;
      loading = true;
      statusEl.textContent = "Loading…";

      if (reset) {
        currentPage = 0;
        currentTags = tags;
        grid.innerHTML = '<div class="loading">Fetching posts…</div>';
        loadMoreWrap.style.display = "none";
      }

      try {
        const url = buildUrl(tags, currentPage);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          if (reset) {
            grid.innerHTML = '<div class="empty">No results</div>';
            countEl.textContent = "";
          }
          statusEl.textContent = "Done";
          loadMoreWrap.style.display = "none";
          return;
        }

        if (reset) grid.innerHTML = "";

        data.forEach(post => {
          const el = document.createElement("div");
          el.className = "item";
          const isVideo = (post.file_url || "").match(/\.(mp4|webm)$/i);
          const thumb = post.preview_url || post.sample_url || post.file_url;

          if (isVideo) {
            el.innerHTML = `<video src="${post.file_url}" muted loop playsinline></video><div class="score">▶ ${post.score || 0}</div>`;
          } else {
            el.innerHTML = `<img src="${thumb}" loading="lazy" alt=""><div class="score">${post.score || 0}</div>`;
          }

          el.addEventListener("click", () => openLightbox(post));
          grid.appendChild(el);
        });

        countEl.textContent = `${grid.querySelectorAll(".item").length} posts`;
        statusEl.textContent = "Ready";
        loadMoreWrap.style.display = data.length >= 40 ? "block" : "none";
      } catch (err) {
        console.error(err);
        if (reset) {
          grid.innerHTML = `<div class="error">Error: ${err.message}<br><small>Check console or try again</small></div>`;
        }
        statusEl.textContent = "Error";
      } finally {
        loading = false;
      }
    }

    function openLightbox(post) {
      const isVideo = (post.file_url || "").match(/\.(mp4|webm)$/i);
      lbContent.innerHTML = "";
      if (isVideo) {
        const v = document.createElement("video");
        v.src = post.file_url;
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        lbContent.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = post.file_url || post.sample_url;
        lbContent.appendChild(img);
      }
      lbInfo.textContent = `ID ${post.id} · score ${post.score} · ${post.tags ? post.tags.slice(0, 80) + "…" : ""}`;
      lightbox.classList.add("active");
    }

    document.getElementById("btnSearch").addEventListener("click", () => {
      const tags = document.getElementById("tags").value.trim();
      search(tags, true);
    });

    document.getElementById("tags").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        search(document.getElementById("tags").value.trim(), true);
      }
    });

    document.getElementById("btnMore").addEventListener("click", () => {
      currentPage++;
      search(currentTags, false);
    });

    document.getElementById("btnClose").addEventListener("click", () => {
      lightbox.classList.remove("active");
      lbContent.innerHTML = "";
    });

    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) {
        lightbox.classList.remove("active");
        lbContent.innerHTML = "";
      }
    });

    // Optional: auto-search a safe default on first load
    // search("rating:safe", true);
  </script>
</body>
</html>
